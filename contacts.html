<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pépite · Mes contacts</title>
<style>
:root{--paper:#F6F3EC;--surface:#fff;--ink:#1B2A4A;--muted:#566079;--line:#DCD6C8;--gold:#B98A3E;--hot:#A8481C;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--paper:#0F1626;--surface:#18233A;--ink:#EEF1F7;--muted:#A8B2C7;--line:#2D3A55;--gold:#E5B65C;--hot:#F0935E;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:28px;margin:0 0 4px}
p.sub{margin:0 0 16px;color:var(--muted)}
.bar{display:grid;grid-template-columns:1fr auto;gap:8px}
input{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 16px;background:var(--ink);color:var(--surface);cursor:pointer}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#msg{margin:12px 0;color:var(--muted);min-height:22px}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.lead.hot{border:2px solid var(--hot)}
.lead .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.lead b{font-size:18px}
.lead .d{color:var(--muted);font-size:14px}
.lead a{color:var(--ink);font-weight:700}
.tag{display:inline-block;background:var(--hot);color:#fff;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700;margin-top:6px}
.meta{color:var(--muted);font-size:15px;margin-top:4px}
</style>
</head>
<body>
<main>
  <h1>Mes contacts Pépite</h1>
  <p class="sub">Les commerçants qui ont essayé la page « Essayez Pépite ». Les plus récents en premier.</p>
  <div class="bar"><input id="code" type="password" autocapitalize="characters" autocomplete="off" aria-label="Code administrateur" placeholder="Code administrateur"><button id="go" type="button">Afficher</button></div>
  <div id="msg" role="status" aria-live="polite"></div>
  <div id="list"></div>
</main>
<script>
(() => {
  const RELAY_URL = "https://pepite.throbbing-glade-a7b3.workers.dev";
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  try { $("code").value = decodeURIComponent((location.hash || "").slice(1)); } catch(e){}
  const day = (iso) => iso ? new Date(iso).toLocaleDateString("fr-FR", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }) : "";
  async function load(){
    const code = $("code").value.trim().toUpperCase(); if (!code){ $("code").focus(); return; }
    $("msg").textContent = "Chargement…"; $("list").innerHTML = "";
    try {
      const r = await fetch(RELAY_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code, action: "leads" }) });
      const d = await r.json();
      if (!r.ok){ $("msg").textContent = r.status === 403 || r.status === 401 ? "Code administrateur incorrect." : "La liste n’a pas pu être chargée."; return; }
      const L = d.leads || [], hot = L.filter(l => l.interesse).length;
      $("msg").textContent = L.length ? `${L.length} contact${L.length > 1 ? "s" : ""}, dont ${hot} demande${hot > 1 ? "s" : ""} d’installation.` : "Aucun contact pour l’instant.";
      $("list").innerHTML = L.map(l => {
        const c = String(l.contact || ""), href = c.includes("@") ? "mailto:" + c : "tel:" + c.replace(/\s/g, "");
        return `<div class="lead${l.interesse ? " hot" : ""}"><div class="top"><b>${esc(l.prenom || "Sans prénom")}</b><span class="d">${esc(day(l.dernier))}</span></div>
          <div><a href="${esc(href)}">${esc(c)}</a></div>
          <div class="meta">${esc(l.commerce || "Commerce non précisé")}${l.ville ? ", " + esc(l.ville) : ""}${l.type ? " (" + esc(l.type) + ")" : ""}</div>
          <div class="meta">Produit essayé : ${esc(l.produit || "?")}. Essais : ${esc(l.essais || 0)}.</div>
          ${l.interesse ? '<span class="tag">Demande d’installation</span>' : ""}</div>`;
      }).join("");
    } catch(e){ $("msg").textContent = "Connexion impossible. Réessayez."; }
  }
  $("go").onclick = load; $("code").addEventListener("keydown", e => { if (e.key === "Enter") load(); });
  if ($("code").value) load();
})();
</script>
</body>
</html>
